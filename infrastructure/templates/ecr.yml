AWSTemplateFormatVersion: '2010-09-09'
Description: Questionnaire - container image repositories for questionnaire-api, dashboard-api and vote-worker.

Parameters:
  ProjectName:
    Type: String
    Default: questionnaire
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ImagesToKeep:
    Type: Number
    Default: 30

Resources:
  QuestionnaireApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}/questionnaire-api'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {"rules":[{"rulePriority":1,"description":"Keep the latest ${ImagesToKeep} images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":${ImagesToKeep}},
            "action":{"type":"expire"}}]}

  DashboardApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}/dashboard-api'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {"rules":[{"rulePriority":1,"description":"Keep the latest ${ImagesToKeep} images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":${ImagesToKeep}},
            "action":{"type":"expire"}}]}

  VoteWorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}/vote-worker'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {"rules":[{"rulePriority":1,"description":"Keep the latest ${ImagesToKeep} images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":${ImagesToKeep}},
            "action":{"type":"expire"}}]}

Outputs:
  QuestionnaireApiRepositoryUri:
    Value: !GetAtt QuestionnaireApiRepository.RepositoryUri
    Export: { Name: !Sub '${ProjectName}-${Environment}-QuestionnaireApiRepositoryUri' }
  DashboardApiRepositoryUri:
    Value: !GetAtt DashboardApiRepository.RepositoryUri
    Export: { Name: !Sub '${ProjectName}-${Environment}-DashboardApiRepositoryUri' }
  VoteWorkerRepositoryUri:
    Value: !GetAtt VoteWorkerRepository.RepositoryUri
    Export: { Name: !Sub '${ProjectName}-${Environment}-VoteWorkerRepositoryUri' }
