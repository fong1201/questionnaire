AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Questionnaire - frontends. One private S3 bucket (no public access, read by CloudFront through
  Origin Access Control) and one CloudFront distribution per React app.
  Each distribution also forwards its API path to the load balancer, so the browser calls the API
  on the same origin (no CORS).

Parameters:
  ProjectName:
    Type: String
    Default: questionnaire
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  QuestionnaireDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for the questionnaire app, e.g. survey.example.com
  DashboardDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for the dashboard app, e.g. dashboard.example.com
  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Conditions:
  HasQuestionnaireDomain: !Not [!Equals [!Ref QuestionnaireDomainName, '']]
  HasDashboardDomain: !Not [!Equals [!Ref DashboardDomainName, '']]

Mappings:
  # AWS managed CloudFront policies.
  ManagedPolicies:
    Cache:
      Optimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      Disabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
    OriginRequest:
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac
    ResponseHeaders:
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03

Resources:
  # ---------------------------------------------------------------- shared
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Environment}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Serves index.html for client-side routes (paths without a file extension).
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite client-side routes to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var lastSegment = request.uri.split('/').pop();
          if (lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # Dashboard API responses carry Cache-Control: max-age=2, and this policy lets CloudFront honour
  # it (capped at 10 s). However many people watch the dashboard, each edge location asks the
  # API about once every 2 s. Only the `hours` query string is part of the cache key.
  DashboardApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-${Environment}-dashboard-api'
        Comment: Short-lived caching that follows the origin Cache-Control header
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 10
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings: [hours]

  # ---------------------------------------------------------------- questionnaire app
  QuestionnaireBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-questionnaire-web-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  QuestionnaireBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref QuestionnaireBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${QuestionnaireBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${QuestionnaireDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt QuestionnaireBucket.Arn
              - !Sub '${QuestionnaireBucket.Arn}/*'
            Condition:
              Bool: { aws:SecureTransport: 'false' }

  QuestionnaireDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${ProjectName}-${Environment} questionnaire'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Aliases: !If [HasQuestionnaireDomain, [!Ref QuestionnaireDomainName], !Ref AWS::NoValue]
        ViewerCertificate: 
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: web
            DomainName: !GetAtt QuestionnaireBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-LoadBalancerDnsName' }
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !FindInMap [ManagedPolicies, Cache, Optimized]
          ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, SecurityHeaders]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/questionnaire/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !FindInMap [ManagedPolicies, Cache, Disabled]
            OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHostHeader]
            ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, SecurityHeaders]

  # ---------------------------------------------------------------- dashboard app
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-dashboard-web-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${DashboardBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DashboardBucket.Arn
              - !Sub '${DashboardBucket.Arn}/*'
            Condition:
              Bool: { aws:SecureTransport: 'false' }

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${ProjectName}-${Environment} dashboard'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Aliases: !If [HasDashboardDomain, [!Ref DashboardDomainName], !Ref AWS::NoValue]
        ViewerCertificate: 
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: web
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-LoadBalancerDnsName' }
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !FindInMap [ManagedPolicies, Cache, Optimized]
          ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, SecurityHeaders]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/dashboard/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref DashboardApiCachePolicy
            ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, SecurityHeaders]

Outputs:
  QuestionnaireBucketName:
    Value: !Ref QuestionnaireBucket
  QuestionnaireDistributionId:
    Value: !Ref QuestionnaireDistribution
  QuestionnaireUrl:
    Value: !Sub
      - 'https://${Domain}'
      - Domain: !If [HasQuestionnaireDomain, !Ref QuestionnaireDomainName, !GetAtt QuestionnaireDistribution.DomainName]
  DashboardBucketName:
    Value: !Ref DashboardBucket
  DashboardDistributionId:
    Value: !Ref DashboardDistribution
  DashboardUrl:
    Value: !Sub
      - 'https://${Domain}'
      - Domain: !If [HasDashboardDomain, !Ref DashboardDomainName, !GetAtt DashboardDistribution.DomainName]
