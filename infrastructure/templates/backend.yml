AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Questionnaire - backend on ECS Fargate. questionnaire-api (queues votes) and dashboard-api
  (reads results) sit behind one Application Load Balancer, routed by path. vote-worker consumes
  the SQS queue and writes to Aurora. A one-off task runs database migrations before each rollout.

Parameters:
  ProjectName:
    Type: String
    Default: questionnaire
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  QuestionnaireApiImageTag:
    Type: String
    Description: questionnaire-api image tag (git SHA)
  DashboardApiImageTag:
    Type: String
    Description: dashboard-api image tag (git SHA)
  VoteWorkerImageTag:
    Type: String
    Description: vote-worker image tag (git SHA)
  MigrationImageTag:
    Type: String
    Description: vote-worker image tag used by the migration task (updated before the services roll)
  TaskCpu:
    Type: Number
    Default: 256
    AllowedValues: [256, 512, 1024, 2048, 4096]
  TaskMemory:
    Type: Number
    Default: 512
  QuestionnaireApiMinCount:
    Type: Number
    Default: 1
  QuestionnaireApiMaxCount:
    Type: Number
    Default: 4
  QuestionnaireApiRequestsPerTarget:
    Type: Number
    Default: 3000
    Description: Scale out when requests per task per minute exceed this.
  DashboardApiMinCount:
    Type: Number
    Default: 1
  DashboardApiMaxCount:
    Type: Number
    Default: 2
  VoteWorkerMinCount:
    Type: Number
    Default: 1
  VoteWorkerMaxCount:
    Type: Number
    Default: 4
  VoteWorkerBacklogPerTask:
    Type: Number
    Default: 1000
    Description: Scale out when queued ballots per worker task exceed this.
  VoteWorkerConcurrency:
    Type: Number
    Default: 4
    Description: Parallel long-polling loops per worker task (each takes up to 10 messages).
  DatabasePoolSize:
    Type: Number
    Default: 5
    Description: Connections per task. Keep (max tasks x pool size) below Aurora max_connections.
  StatsCacheSeconds:
    Type: Number
    Default: 2
  LogRetentionDays:
    Type: Number
    Default: 30
  CorsOrigins:
    Type: String
    Default: ''
    Description: Comma separated origins. Leave empty when the apps are served through CloudFront.

Resources:
  # ------------------------------------------------------------------ cluster
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${Environment}'
      ClusterSettings:
        # Also provides RunningTaskCount, used by the vote-worker scaling policy.
        - { Name: containerInsights, Value: enabled }

  # ------------------------------------------------------------------ IAM
  # Used by the ECS agent: pull images, write logs, inject the database secret.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseSecretArn' }

  # Application roles: each service can do exactly what it needs and nothing more.
  QuestionnaireApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-votes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteQueueArn' }

  VoteWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: consume-votes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteQueueArn' }

  # dashboard-api and the migration task only talk to the database, which needs no IAM permission.
  NoAwsAccessTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # ------------------------------------------------------------------ logs
  QuestionnaireApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-${Environment}/questionnaire-api'
      RetentionInDays: !Ref LogRetentionDays

  DashboardApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-${Environment}/dashboard-api'
      RetentionInDays: !Ref LogRetentionDays

  VoteWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-${Environment}/vote-worker'
      RetentionInDays: !Ref LogRetentionDays

  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-${Environment}/migrate'
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------ load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}'
      Type: application
      Scheme: internet-facing
      Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-PublicSubnetIds' }]
      SecurityGroups:
        - !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-LoadBalancerSecurityGroupId' }
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }

  # CloudFront terminates TLS for viewers and reaches the load balancer over HTTP; the load
  # balancer's security group only admits CloudFront's origin-facing address ranges.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"message":"Not Found","statusCode":404}'

  QuestionnaireApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VpcId' }
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /api/questionnaire/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  DashboardApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VpcId' }
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /api/dashboard/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  QuestionnaireApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ['/api/questionnaire', '/api/questionnaire/*'] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref QuestionnaireApiTargetGroup

  DashboardApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ['/api/dashboard', '/api/dashboard/*'] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref DashboardApiTargetGroup

  # ------------------------------------------------------------------ task definitions
  QuestionnaireApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-questionnaire-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt QuestionnaireApiTaskRole.Arn
      ContainerDefinitions:
        - Name: questionnaire-api
          Image: !Sub
            - '${RepositoryUri}:${QuestionnaireApiImageTag}'
            - RepositoryUri: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-QuestionnaireApiRepositoryUri' }
          Essential: true
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: '3000' }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SQS_QUEUE_URL, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteQueueUrl' } }
            - { Name: CORS_ORIGINS, Value: !Ref CorsOrigins }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref QuestionnaireApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  VoteWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-vote-worker'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt VoteWorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: vote-worker
          Image: !Sub
            - '${RepositoryUri}:${VoteWorkerImageTag}'
            - RepositoryUri: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteWorkerRepositoryUri' }
          Essential: true
          # SIGTERM stops polling; in-flight batches finish (and unacknowledged ones are redelivered).
          StopTimeout: 30
          HealthCheck:
            Command: [CMD-SHELL, 'wget -qO- http://127.0.0.1:3000/health || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: '3000' }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SQS_QUEUE_URL, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteQueueUrl' } }
            - { Name: WORKER_CONCURRENCY, Value: !Ref VoteWorkerConcurrency }
            - { Name: DB_POOL_SIZE, Value: !Ref DatabasePoolSize }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseWriterEndpoint' } }
            - { Name: DB_PORT, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabasePort' } }
            - { Name: DB_NAME, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseName' } }
            - { Name: DB_SSL, Value: 'true' }
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${SecretArn}:username::'
                - SecretArn: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseSecretArn' }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseSecretArn' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref VoteWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  DashboardApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-dashboard-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt NoAwsAccessTaskRole.Arn
      ContainerDefinitions:
        - Name: dashboard-api
          Image: !Sub
            - '${RepositoryUri}:${DashboardApiImageTag}'
            - RepositoryUri: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DashboardApiRepositoryUri' }
          Essential: true
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: '3000' }
            - { Name: STATS_CACHE_SECONDS, Value: !Ref StatsCacheSeconds }
            - { Name: DB_POOL_SIZE, Value: !Ref DatabasePoolSize }
            - { Name: CORS_ORIGINS, Value: !Ref CorsOrigins }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseReaderEndpoint' } }
            - { Name: DB_PORT, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabasePort' } }
            - { Name: DB_NAME, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseName' } }
            - { Name: DB_SSL, Value: 'true' }
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${SecretArn}:username::'
                - SecretArn: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseSecretArn' }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseSecretArn' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DashboardApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-migrate'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: 256
      Memory: 512
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt NoAwsAccessTaskRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub
            - '${RepositoryUri}:${MigrationImageTag}'
            - RepositoryUri: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteWorkerRepositoryUri' }
          Essential: true
          Command: [node, /repo/packages/database/dist/migrate.js]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseWriterEndpoint' } }
            - { Name: DB_PORT, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabasePort' } }
            - { Name: DB_NAME, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseName' } }
            - { Name: DB_SSL, Value: 'true' }
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${SecretArn}:username::'
                - SecretArn: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseSecretArn' }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${SecretArn}:password::'
                - SecretArn: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DatabaseSecretArn' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrate

  # ------------------------------------------------------------------ services
  # Tasks run in public subnets with public IPs so they can reach AWS APIs without a NAT
  # gateway. Their security groups accept traffic only from the load balancer (APIs) or not
  # at all (worker), and the database is in private subnets with no internet route.
  QuestionnaireApiService:
    Type: AWS::ECS::Service
    DependsOn: QuestionnaireApiListenerRule
    Properties:
      ServiceName: questionnaire-api
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref QuestionnaireApiTaskDefinition
      DesiredCount: !Ref QuestionnaireApiMinCount
      HealthCheckGracePeriodSeconds: 60
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-QuestionnaireApiSecurityGroupId' }
      LoadBalancers:
        - ContainerName: questionnaire-api
          ContainerPort: 3000
          TargetGroupArn: !Ref QuestionnaireApiTargetGroup

  DashboardApiService:
    Type: AWS::ECS::Service
    DependsOn: DashboardApiListenerRule
    Properties:
      ServiceName: dashboard-api
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref DashboardApiTaskDefinition
      DesiredCount: !Ref DashboardApiMinCount
      HealthCheckGracePeriodSeconds: 60
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-DashboardApiSecurityGroupId' }
      LoadBalancers:
        - ContainerName: dashboard-api
          ContainerPort: 3000
          TargetGroupArn: !Ref DashboardApiTargetGroup

  VoteWorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: vote-worker
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref VoteWorkerTaskDefinition
      DesiredCount: !Ref VoteWorkerMinCount
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteWorkerSecurityGroupId' }

  # ------------------------------------------------------------------ autoscaling
  # questionnaire-api: stateless, scales on request rate (and CPU as a safety net).
  QuestionnaireApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${QuestionnaireApiService.Name}'
      MinCapacity: !Ref QuestionnaireApiMinCount
      MaxCapacity: !Ref QuestionnaireApiMaxCount

  QuestionnaireApiRequestScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: requests-per-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref QuestionnaireApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref QuestionnaireApiRequestsPerTarget
        ScaleOutCooldown: 30
        ScaleInCooldown: 300
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub '${LoadBalancer.LoadBalancerFullName}/${QuestionnaireApiTargetGroup.TargetGroupFullName}'

  QuestionnaireApiCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cpu-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref QuestionnaireApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  # dashboard-api: reads are cached, so CPU is enough.
  DashboardApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${DashboardApiService.Name}'
      MinCapacity: !Ref DashboardApiMinCount
      MaxCapacity: !Ref DashboardApiMaxCount

  DashboardApiCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cpu-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref DashboardApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  # vote-worker: scales on queue backlog per running task, so a spike of queued ballots adds
  # workers and an empty queue scales back to the minimum.
  VoteWorkerScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${VoteWorkerService.Name}'
      MinCapacity: !Ref VoteWorkerMinCount
      MaxCapacity: !Ref VoteWorkerMaxCount

  VoteWorkerBacklogScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: queue-backlog-per-task
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref VoteWorkerScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref VoteWorkerBacklogPerTask
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
        CustomizedMetricSpecification:
          Metrics:
            - Id: queued
              ReturnData: false
              MetricStat:
                Stat: Sum
                Metric:
                  Namespace: AWS/SQS
                  MetricName: ApproximateNumberOfMessagesVisible
                  Dimensions:
                    - Name: QueueName
                      Value: !ImportValue { 'Fn::Sub': '${ProjectName}-${Environment}-VoteQueueName' }
            - Id: tasks
              ReturnData: false
              MetricStat:
                Stat: Average
                Metric:
                  Namespace: ECS/ContainerInsights
                  MetricName: RunningTaskCount
                  Dimensions:
                    - { Name: ClusterName, Value: !Ref Cluster }
                    - { Name: ServiceName, Value: !GetAtt VoteWorkerService.Name }
            - Id: backlogPerTask
              Label: Queued ballots per worker task
              Expression: queued / tasks
              ReturnData: true

Outputs:
  ClusterName:
    Value: !Ref Cluster
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
    Export: { Name: !Sub '${ProjectName}-${Environment}-LoadBalancerDnsName' }
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTaskDefinition
