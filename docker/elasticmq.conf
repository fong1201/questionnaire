# ElasticMQ: SQS-compatible queue for local Docker/Kubernetes runs.
# Mirrors infrastructure/templates/messaging.yml (visibility timeout, redrive to a DLQ).
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  votes {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "votes-dlq"
      maxReceiveCount = 5
    }
  }
  votes-dlq {
    messageRetentionPeriod = 14 days
  }
}
